name: Secret Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.3"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # Blocks the build: no new secret may enter the working tree.
      - name: Run gitleaks (working tree)
        run: gitleaks detect --source . --no-git --redact --verbose --exit-code 1

      # Informational: scans the whole history so pre-existing leaks stay visible,
      # but does not fail the build (history is immutable without a rewrite, and the
      # known findings are example/placeholder or publishable keys — see .gitleaks.toml).
      - name: Run gitleaks (full git history, informational)
        continue-on-error: true
        run: gitleaks detect --source . --redact --verbose --exit-code 1
